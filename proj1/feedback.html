<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Feedback form for the Las Vegas travel website">
    <title>Las Vegas Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Las Vegas Feedback</h1>
        <p>Share your thoughts about Las Vegas</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="attractions.html">Attractions</a>
        <a href="food.html">Food</a>
        <a href="casinos.html">Casinos</a>
        <a href="feedback.html">Feedback</a>
    </nav>

    <main>
        <section>
            <h2>Tell Me About Your Las Vegas Experience</h2>

            <!--
                The form element is located on the feedback page.
                It collects information from visitors and sends it
                to the thank-you page.

                The action attribute tells the browser where to send
                the form after it is submitted.

                The method attribute tells the browser to use the GET
                method when submitting the form.

                The autocomplete attribute allows the browser to suggest
                information that the visitor has entered before.
            -->
            <form action="thank-you.html" method="get" autocomplete="on">

                <!-- The label element describes the visitor name field. -->
                <label for="visitor-name">Your name:</label>
                <input type="text" id="visitor-name" name="visitor-name">

                <!-- This label describes the visitor's favorite location field. -->
                <label for="favorite-place">Favorite Las Vegas place:</label>
                <input type="text" id="favorite-place" name="favorite-place">

                <!-- This label describes the visitor's feedback area. -->
                <label for="comments">Your comments:</label>
                <textarea id="comments" name="comments" rows="6" cols="40"></textarea>

                <!-- The button element submits the completed form. -->
                <button type="submit">Submit Feedback</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Created by Edgar Margarian</p>
    </footer>

</body>

</html>
